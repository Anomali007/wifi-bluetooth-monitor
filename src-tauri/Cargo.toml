[package]
name = "wifi-bluetooth-monitor"
version = "0.1.0"
description = "Listen-only Wi-Fi and Bluetooth environment monitor for macOS: flags evil-twin access points and possible persistent trackers."
authors = ["Mali Franzese"]
license = "MIT"
repository = "https://github.com/Anomali007/wifi-bluetooth-monitor"
edition = "2021"
rust-version = "1.88"
default-run = "wifi-bluetooth-monitor"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[[bin]]
name = "wifi-bluetooth-monitor"
path = "src/main.rs"

# Agent tools: a CLI and an MCP server over the same store. Reads and edits the SQLite file
# only; opens no socket and spawns no process (tests/lan_listen_only.rs checks the source).
[[bin]]
name = "wbm"
path = "src/bin/wbm.rs"

[lib]
name = "app_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.7", features = [] }

[dependencies]
serde_json = "1.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
tauri = { version = "2.12", features = [] }
tauri-plugin-log = "2.10"
tauri-plugin-notification = "2.7"
# Scan loop needs: spawn, sleep/interval, channels. Tauri brings its own runtime; these are for library code.
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "time", "sync", "io-std", "io-util"] }
futures = "0.3" # btleplug event streams
sha2 = "0.11" # identifier hashing (model::hash_identifier)
hex = "0.4"
rand = "0.10" # salt generation (store)
btleplug = "0.13" # BLE scanning (receive-only)
rusqlite = { version = "0.40", features = ["bundled"] } # local store
# LAN module (WP-D): sysctl ARP table, getifaddrs, receive-only mDNS socket options. Declared
# here by the Foundation pass so no work package has to touch Cargo.toml / Cargo.lock.
libc = "0.2"
socket2 = { version = "0.6", features = ["all"] }

# MCP server for `wbm mcp` (the official Rust SDK). Protocol and stdio framing only: no HTTP,
# OAuth or child-process features, so no network client is compiled in.
rmcp = { version = "3.7", default-features = false, features = ["server", "transport-async-rw"] }

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6"
objc2-foundation = "0.3"
objc2-core-wlan = "0.3"
objc2-core-location = "0.3"
objc2-service-management = { version = "0.3", default-features = false, features = ["std", "SMAppService", "objc2", "objc2-foundation"] }

[dev-dependencies]
regex = "1.13.1"
tempfile = "3"
