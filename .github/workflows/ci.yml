name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: npx tsc --noEmit
      - run: pnpm lint
      - name: vitest (must run at least one test)
        run: pnpm test 2>&1 | scripts/assert-vitest-ran.sh
        shell: bash -o pipefail {0}
      - name: public-repo safety check
        run: scripts/check-public-safety.sh
      - run: cargo fmt --check
        working-directory: src-tauri
      - run: cargo clippy --all-targets -- -D warnings
        working-directory: src-tauri
      - name: cargo test (must run at least one test)
        working-directory: src-tauri
        run: cargo test 2>&1 | ../scripts/assert-tests-ran.sh
        shell: bash -o pipefail {0}
